<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Panorama - Three.js + WebXR</title>

    <link rel="stylesheet" href="style.css">

    <!-- Three.js (draws the 3D scene) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <button id="enterVR">Enter VR</button>
    <div id="status">Checking VR support...</div>

    <script type="module">
        import * as THREE from "three";

        const button = document.querySelector("#enterVR");
        const status = document.querySelector("#status");

        // 1. Scene, camera, renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.rotation.order = "YXZ";

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. The 360 photo, painted on the inside of a big sphere
        const geometry = new THREE.SphereGeometry(500, 60, 40);
        geometry.scale(-1, 1, 1);

        const texture = new THREE.TextureLoader().load("cowboy_town_saloon.jpg");
        texture.colorSpace = THREE.SRGBColorSpace;

        const material = new THREE.MeshBasicMaterial({ map: texture });
        const panorama = new THREE.Mesh(geometry, material);
        panorama.rotation.y = -Math.PI / 2;
        scene.add(panorama);

        // 3. Mouse / touch drag to look around
        let yaw = 0, pitch = 0;
        let dragging = false, lastX = 0, lastY = 0;

        renderer.domElement.addEventListener("pointerdown", (e) => {
            dragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        window.addEventListener("pointerup", () => {
            dragging = false;
        });

        window.addEventListener("pointermove", (e) => {
            if (!dragging) return;

            yaw += (e.clientX - lastX) * 0.005;
            pitch += (e.clientY - lastY) * 0.005;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

            lastX = e.clientX;
            lastY = e.clientY;

            camera.rotation.set(pitch, yaw, 0);
        });

        // 4. WebXR: check support
        if (navigator.xr) {
            navigator.xr.isSessionSupported("immersive-vr").then((ok) => {
                status.textContent = ok ? "VR headset ready. Drag to look around." : "No VR headset found. Drag to look around.";
            }).catch(() => {
                status.textContent = "Could not check VR support. Drag to look around.";
            });
        } else {
            status.textContent = "WebXR not available. Drag to look around.";
        }

        // 5. WebXR: start / stop the VR session
        let session = null;

        button.addEventListener("click", async () => {
            if (session) {
                await session.end();
                return;
            }

            if (!navigator.xr) {
                status.textContent = "WebXR is not supported by this browser.";
                return;
            }

            try {
                session = await navigator.xr.requestSession("immersive-vr");
                await renderer.xr.setSession(session);
                button.textContent = "Exit VR";

                session.addEventListener("end", () => {
                    session = null;
                    button.textContent = "Enter VR";
                });
            } catch (error) {
                session = null;
                status.textContent = "Could not start VR. Check browser and headset.";
                console.error(error);
            }
        });

        // 6. Draw every frame
        renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
        });

        // 7. Keep the view correct when the window is resized
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
